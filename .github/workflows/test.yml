name: Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-scroll:
    name: macOS 15 native scroll (original 2563351)
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          ref: 2563351804c515b0a84565a09823ea80de56d518

      - name: Select original failing toolchain
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Verify environment
        shell: bash
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          version="$(sw_vers -productVersion)"
          [[ "${version%%.*}" == 15 ]]

      - name: Repeat the original native scroll suite until first failure
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            printf 'Native scroll reproduction attempt %s of 20\n' "$attempt"
            args=(--filter '^VellumTests[.]PDFNativeScrollTests/')
            if (( attempt > 1 )); then args=(--skip-build "${args[@]}"); fi
            scripts/test.sh "${args[@]}"
          done

      - name: Upload first-failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: native-scroll-first-failure-original
          path: ${{ runner.temp }}/vellum-tests.*/results.*/
          retention-days: 7
